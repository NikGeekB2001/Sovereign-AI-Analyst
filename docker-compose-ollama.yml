services:
  # Ollama LLM сервис
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/root/.ollama/models
    # ============================================================
    # GPU поддержка (ОПЦИОНАЛЬНО)
    # Раскомментируйте ОДИН из вариантов ниже, если у вас есть NVIDIA GPU
    # ============================================================
    # Вариант 1: Использование deploy (Linux с NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Вариант 2: Использование runtime (Windows WSL2 / Linux)
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - sovereign-network
    restart: unless-stopped

  # API Gateway сервис
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - neo4j
      - ollama
      - langfuse
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_TRACING_ENABLED=true
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:3b}
    volumes:
      - ./models:/app/models
    networks:
      - sovereign-network
    restart: unless-stopped

  # Векторная база данных Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    networks:
      - sovereign-network
    restart: unless-stopped

  # Графовая база данных Neo4j
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - sovereign-network
    restart: unless-stopped

  # База данных для Langfuse (PostgreSQL)
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=langfuse
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-langfuse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sovereign-network
    restart: unless-stopped

  # Сервис Langfuse
  langfuse:
    image: langfuse/langfuse:2.28.0
    ports:
      - "3002:3000"
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me}
      - SALT=${SALT:-change-me}
      - DATABASE_URL=postgresql://langfuse:${POSTGRES_PASSWORD:-langfuse}@postgres:5432/langfuse
      - NEXT_PUBLIC_LANGFUSE_SECONDARY_INGESTION_HOSTNAME=http://localhost:3002
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=ingestion_v2
    depends_on:
      - postgres
    networks:
      - sovereign-network
    restart: unless-stopped

  # Мониторинг (Prometheus + Grafana)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - sovereign-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    networks:
      - sovereign-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  sovereign-network:
    driver: bridge

volumes:
  ollama_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  postgres_data:
  prometheus_data:
  grafana_data: