global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'fastapi-app'
    static_configs:
      # Локальный запуск API вне docker: host.docker.internal.
      # При развёртывании через deploy/docker-compose.yml: 'api-gateway:8000'.
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # neo4j: /metrics недоступен в neo4j:5-community (Metrics Extension отсутствует)
  # - job_name: 'neo4j'
  #   static_configs:
  #     - targets: ['neo4j:7474']
  #   metrics_path: '/metrics'
