version: '3.8'
services:
  neo4j:
    image: neo4j:5.16.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - ./infra/data/neo4j:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./infra/data/qdrant:/qdrant/storage
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2.28.0
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_SECRET=your-nextauth-secret-here
      - SALT=your-salt-here
      - DATABASE_URL=postgresql://langfuse:langfuse@postgres:5432/langfuse
      - NEXT_PUBLIC_LANGFUSE_SECONDARY_INGESTION_HOSTNAME=http://localhost:3000
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=ingestion_v2
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=langfuse
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
    volumes:
      - ./infra/data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - QDRANT_URL=http://qdrant:6333
      - LANGFUSE_HOST=http://langfuse:3000
    depends_on:
      - neo4j
      - qdrant
      - langfuse
    volumes:
      - .:/app
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped